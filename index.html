<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>وەستا غەریب — کاڵاکان و ناونیشان</title>
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"KU";src:local("Estedad Bold"),url(fonts/Estedad-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Black"),url(fonts/Estedad-Black.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"KU";src:local("Estedad Medium"),url(fonts/Estedad-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"KU",system-ui,sans-serif;background:radial-gradient(120vw 90vw at 50% -20%,rgba(201,255,47,.16),transparent 60%),#0b0d12;color:#f2f4ee;padding:calc(26px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));display:grid;place-items:start center}
main{width:100%;max-width:440px;display:grid;gap:12px}
header{text-align:center;display:grid;justify-items:center;gap:6px;margin-bottom:10px}
.coin{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(201,255,47,.5),0 18px 50px -12px rgba(201,255,47,.55)}
.coin img{width:88px;height:88px;border-radius:50%}
h1{font-size:30px;font-weight:900;letter-spacing:-.4px;margin-top:8px}
header p{color:#a8b0a0;font-weight:500;font-size:15.5px}
a{display:grid;grid-template-columns:52px minmax(0,1fr) 20px;gap:14px;align-items:center;text-decoration:none;color:inherit;padding:15px 16px;border-radius:20px;background:linear-gradient(180deg,#171b24,#11141b);border:1px solid #262c38;transition:transform .15s,border-color .15s}
a:active{transform:scale(.98)}a:hover{border-color:#c9ff2f}
a .i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#1f2530;color:#c9ff2f}
a.wa{background:linear-gradient(135deg,#c9ff2f,#9be81c);color:#0b1000;border-color:transparent}a.wa .i{background:rgba(11,16,0,.14);color:#0b1000}a.wa small{color:rgba(11,16,0,.72)}
a b{display:block;font-size:17.5px;font-weight:700;line-height:1.5}
a small{display:block;color:#a8b0a0;font-size:14px;font-weight:500;line-height:1.6}
a svg{width:26px;height:26px}a>svg{width:18px;height:18px;opacity:.6}
h2{font-size:14px;font-weight:700;color:#a8b0a0;margin:12px 4px 0}
footer{text-align:center;color:#6f7768;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<main>
  <header><div class="coin"><img src="logo.png" alt="وەستا غەریب" width="88" height="88"></div><h1>وەستا غەریب</h1><p>سوپاس بۆ کڕینەکەت — یەکێک هەڵبژێرە</p></header>
  <a class="wa" href="https://wa.me/c/9647514344050"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg></span><span><b>بۆ بینینی کاڵاکانمان</b><small>کەتەلۆگەکەمان لە واتسئاپ</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
  <a href="https://wa.me/9647514344050"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.7A8.4 8.4 0 1 1 21 11.5z"/></svg></span><span><b>نامەمان بۆ بنێرە</b><small>ڕاستەوخۆ لە واتسئاپ</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
  <h2>📍 نەخشەی شوێنی دوکان</h2>
  <a href="https://maps.app.goo.gl/FrDj7PZnFwVNTB7s6?g_st=ic"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.900 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><span><b>لقی سەرەکی</b><small>60 مەتری — ڕوکنی ئیسکان</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
  <a href="https://vt.tiktok.com/ZSVhaHEbn/"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span><span><b>ناونیشان بە ڤیدیۆ</b><small>ڕێگای لقی سەرەکی لە تیکتۆک</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
  <a href="https://maps.app.goo.gl/acSRcYwwYYDRS7b27?g_st=ic"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><span><b>لقی دووەم</b><small>کۆتری سەلام — باڵەخانەی ئاشتی، تابقی سێیەم</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
  <footer>WASTA GHAREB</footer>
</main>
</body>
</html>
